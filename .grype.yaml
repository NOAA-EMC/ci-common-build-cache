add-cpes-if-none: false
only-fixed: true

ignore:
  - namespace: github:language:javascript
  - namespace: github:language:ruby
  - namespace: github:language:php
  - namespace: github:language:dotnet
  - namespace: nvd:cpe
    fix-state: unknown
  # Don't match 'tar' with 'node-tar'
  - reason: "Spack builds GNU tar (C), not npm node-tar"
    package:
      name: tar
    match-details:
      - matcher: cpe-matcher
        searched-by:
          cpes:
            - "cpe:2.3:a:isaacs:node-tar:*"
            - "cpe:2.3:a:tar_project:tar:*"
